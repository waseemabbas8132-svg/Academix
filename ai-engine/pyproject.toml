[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "academix-ai"
version = "0.1.0"
description = "Local OCR and teacher-reviewed assignment evaluation engine for Academix"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "Pillow>=10.4,<13.0",
    "PyMuPDF>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
ocr = [
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.10,<5.0",
    "torch>=2.4,<3.0",
    "transformers>=4.45,<5.0",
]
test = [
    "pytest>=8.0,<9.0",
    "jiwer>=3.0,<5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["academix_ai*", "preprocessing*", "evaluation*", "inference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
